# Role → scope → ownership → impact.
- role: Senior Product Engineer
  company: EasyLlama
  period: "Oct 2025 – present"
  scope: "AI agent platform inside a multi-tenant Rails SaaS: system assistants, report builder, analytics agents, routing, tooling, conversation state, tracking and export workflows."
  owned: DRI and technical owner for the platform — architecture, implementation strategy and delivery; assistant boundaries, routing, reusable tool abstractions, evaluation infrastructure and observability.
  impact: "Led the move from isolated AI interactions to a multi-agent platform supporting dashboards, data querying, report generation, saved reports, CSV exports, embedded widgets and cross-assistant hand-off, with evaluation infrastructure that catches regressions before release."
- role: Senior Software Engineer
  company: boomnow
  period: "Dec 2024 – May 2025"
  scope: "Hospitality platform integrations: Airbnb, third-party PMS platforms and external booking providers; booking synchronisation and multi-unit reservation allocation."
  owned: DRI for the Airbnb integration architecture and implementation and for the synchronisation workflows with external property-management systems.
  impact: "Booking synchronisation and reservation allocation workflows in production, debugging tooling for multi-tenant environments, and work on scaling booking infrastructure for reservation-heavy workloads."
- role: Tech Lead
  company: MobiDev
  period: "Jun 2022 – Feb 2023"
  scope: "A SaaS payment platform built from the ground up."
  owned: Technical planning, release coordination and engineering workflows; technical documentation, solution investigations and workflow diagrams.
  impact: "CI/CD pipeline improvements cut deployment time by roughly 25%; the platform shipped with a repeatable release process."
- role: Full-stack Software Engineer
  company: DigitalBridges
  period: "Nov 2016 – Jan 2022"
  scope: "Core application architecture for a data-heavy platform: large-scale web crawlers, proxy rotation, crypto exchange API integrations, high-load search and query workflows."
  owned: Key role in the core architecture; crawling and proxy-rotation systems; exchange integrations; the incremental migration of the legacy frontend from jQuery to Vue.js.
  impact: Resolved long-standing production issues affecting stability and data consistency, and kept search and query workloads fast as the dataset grew.
