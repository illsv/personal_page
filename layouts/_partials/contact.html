<section id="contact" class="contact rule">
  <div class="wrap contact-inner">
    <p class="mono">Contact</p>
    <h2 class="contact-title">Have a technical problem <em>worth solving?</em></h2>
    <div class="contact-row">
      <a class="contact-mail serif" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      <div class="contact-links">
        <div><span class="mono">GitHub</span><a href="{{ site.Params.github }}" rel="me">{{ site.Params.githubHandle }}</a></div>
        <div><span class="mono">LinkedIn</span><a href="{{ site.Params.linkedin }}" rel="me">{{ site.Params.author }}</a></div>
      </div>
    </div>
  </div>
</section>
